<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ebru AI — İzleme</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --kart: #ffffff;
      --cizgi: #e2e5ea;
      --metin: #1c1f24;
      --soluk: #6b7280;
      --iyi: #147a3d;
      --kotu: #b3261e;
      --vurgu: #3f51b5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --kart: #1d2025;
        --cizgi: #2c3037;
        --metin: #e8eaed;
        --soluk: #9aa1ab;
        --iyi: #5fd08a;
        --kotu: #f2837a;
        --vurgu: #8c9eff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: var(--bg); color: var(--metin);
      font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .alt { color: var(--soluk); font-size: 13px; margin-bottom: 18px; }
    .kutular {
      display: grid; gap: 12px; margin-bottom: 22px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }
    .kutu {
      background: var(--kart); border: 1px solid var(--cizgi);
      border-radius: 10px; padding: 14px;
    }
    .kutu .sayi { font-size: 26px; font-weight: 600; }
    .kutu .etiket { color: var(--soluk); font-size: 12px; }
    h2 { font-size: 15px; margin: 22px 0 10px; }
    .sarmal { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse;
      background: var(--kart); border: 1px solid var(--cizgi);
      border-radius: 10px; overflow: hidden; font-size: 13px;
    }
    th, td {
      text-align: left; padding: 9px 11px;
      border-bottom: 1px solid var(--cizgi); white-space: nowrap;
    }
    th { color: var(--soluk); font-weight: 600; font-size: 12px; }
    tr:last-child td { border-bottom: none; }
    td.prompt { white-space: normal; min-width: 240px; }
    .ok { color: var(--iyi); font-weight: 600; }
    .hata { color: var(--kotu); font-weight: 600; }
    .bos { color: var(--soluk); padding: 18px; text-align: center; }
    .yenile { color: var(--soluk); font-size: 12px; margin-top: 14px; }
    /* Mobil uygulamayla ortak yönetim görünümü. */
    :root { --bg:#101418; --kart:#00142c; --cizgi:rgba(212,227,255,.14); --metin:#f4f0e8; --soluk:#c5c6ca; --iyi:#89d5c1; --kotu:#ffb4ab; --vurgu:#c7a65a; }
    body { font-family:Inter,system-ui,sans-serif; }
    h1,h2 { font-family:'Playfair Display',Georgia,serif; }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='mobile-theme.css') }}?v=20260814-2">
</head>
<body>
  <h1>Ebru AI — İzleme Paneli</h1>
  <div class="alt" id="durum">Yükleniyor…</div>

  <div class="kutular">
    <div class="kutu"><div class="sayi" id="toplam">–</div><div class="etiket">Toplam istek</div></div>
    <div class="kutu"><div class="sayi ok" id="basarili">–</div><div class="etiket">Başarılı</div></div>
    <div class="kutu"><div class="sayi hata" id="hatali">–</div><div class="etiket">Hatalı</div></div>
    <div class="kutu"><div class="sayi" id="kuyruk">–</div><div class="etiket">Kuyrukta</div></div>
    <div class="kutu"><div class="sayi" id="cihazsayi">–</div><div class="etiket">Bugünkü cihaz</div></div>
  </div>

  <h2>Bugün üretim yapan cihazlar</h2>
  <div class="sarmal"><table id="cihazlar"></table></div>

  <h2>Son istekler</h2>
  <div class="sarmal"><table id="istekler"></table></div>

  <div class="yenile">5 saniyede bir otomatik yenilenir.</div>

<script>
// Sunucu bu değeri şablona basıyor (app.py: render_template("admin.html",
// token=...)). Tanımı silinince aşağıdaki /stats isteği ReferenceError
// veriyor ve panel hiç veri çekemiyordu.
const TOKEN = {{ token | tojson }};

function saat(ts) {
  return new Date(ts * 1000).toLocaleTimeString('tr-TR');
}

function kacak(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function yenile() {
  let veri;
  try {
    const cevap = await fetch(`/stats?token=${encodeURIComponent(TOKEN)}`);
    if (!cevap.ok) throw new Error('yetki veya sunucu hatası');
    veri = await cevap.json();
  } catch (e) {
    document.getElementById('durum').textContent = 'Bağlanılamadı: ' + e.message;
    return;
  }

  document.getElementById('durum').textContent =
    `Günlük limit: ${veri.gunluk_limit} · Aktif iş: ${veri.aktif_isler} · Son güncelleme ${new Date().toLocaleTimeString('tr-TR')}`;
  document.getElementById('toplam').textContent = veri.sayaclar.toplam;
  document.getElementById('basarili').textContent = veri.sayaclar.basarili;
  document.getElementById('hatali').textContent = veri.sayaclar.hatali;
  document.getElementById('kuyruk').textContent = veri.kuyruk;
  document.getElementById('cihazsayi').textContent = veri.cihazlar.length;

  const c = document.getElementById('cihazlar');
  if (!veri.cihazlar.length) {
    c.innerHTML = '<tr><td class="bos">Bugün henüz üretim yok.</td></tr>';
  } else {
    c.innerHTML = '<tr><th>Cihaz / IP</th><th>Bugünkü üretim</th></tr>' +
      veri.cihazlar.map(x =>
        `<tr><td>${kacak(x.kimlik)}</td><td>${x.bugun} / ${veri.gunluk_limit}</td></tr>`
      ).join('');
  }

  const t = document.getElementById('istekler');
  if (!veri.istekler.length) {
    t.innerHTML = '<tr><td class="bos">Henüz istek yok.</td></tr>';
  } else {
    t.innerHTML = '<tr><th>Saat</th><th>Durum</th><th>Süre</th><th>Cihaz</th><th>IP</th><th>Kaynak</th><th>İstek</th></tr>' +
      veri.istekler.map(x => {
        const ok = x.durum === 'success';
        return `<tr>
          <td>${saat(x.zaman)}</td>
          <td class="${ok ? 'ok' : 'hata'}">${ok ? 'başarılı' : 'hata'}</td>
          <td>${x.sure} sn</td>
          <td>${kacak(x.kimlik)}</td>
          <td>${kacak(x.ip)}</td>
          <td>${kacak(x.kaynak || '-')}</td>
          <td class="prompt">${kacak(x.mesaj || x.prompt)}</td>
        </tr>`;
      }).join('');
  }
}

yenile();
setInterval(yenile, 5000);
</script>
</body>
</html>
