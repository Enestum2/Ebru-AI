name: ebru_ai_wallpaper
description: "AI destekli ebru duvar kağıdı üretici uygulaması."
publish_to: 'none'

# Sondaki sayı versionCode. Her dağıtılan sürümde artmalı, yoksa
# telefonlar yeni APK'yı güncelleme olarak ayırt edemiyor.
version: 1.1.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Backend ile iletişim için
  dio: ^5.7.0

  # Üretilen görselleri yerelde saklama (geçmiş/galeri)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Wallpaper olarak ayarlama (Android)
  async_wallpaper: ^3.1.0

  # Ekran çözünürlüğü / cihaz bilgisi
  device_info_plus: ^10.1.2

  # Görseli galeriye kaydetme
  gal: ^2.3.0

  # Paylaşma (WhatsApp, vb.)
  share_plus: ^10.0.2

  # Görseli yakınlaştırıp inceleme
  photo_view: ^0.15.0

  # Sunucu adresi gibi ayarları kalıcı saklama
  shared_preferences: ^2.3.2

  # Üretim bitince bildirim gösterme
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Seçim ekranındaki önizlemeler — gerçek üretimlerden alındı.
    - assets/previews/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600